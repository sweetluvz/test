name: Notion Backup

on:
  schedule:
    # 18:00 UTC = 1:00 AM GMT+7 — chạy mỗi đêm
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Cấp quyền ghi để workflow có thể commit backup về repo
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Dùng PAT thay vì GITHUB_TOKEN để bypass branch protection nếu có
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Notion backup
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python backup/backup_notion.py

      - name: Commit & push backup
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backup/data/
          # Chỉ commit nếu có thay đổi thực sự
          git diff --cached --quiet || \
            git commit -m "chore: notion backup $(date -u +%Y-%m-%d)" && \
            git push origin HEAD
