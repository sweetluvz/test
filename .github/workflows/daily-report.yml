name: Daily Morning Report

on:
  schedule:
    # 2:00 AM UTC = 9:00 AM GMT+7 mỗi ngày
    - cron: "0 2 * * *"
  workflow_dispatch: # cho phép chạy thủ công từ GitHub UI

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}        # tuỳ chọn
          WEATHER_CITY: ${{ vars.WEATHER_CITY }}            # tuỳ chọn, default "Ho Chi Minh City"
          STOCK_SYMBOLS: ${{ vars.STOCK_SYMBOLS }}          # tuỳ chọn, default "VNM,FPT,VIC"
          USD_VND_RATE: ${{ vars.USD_VND_RATE }}            # tuỳ chọn, default 25000
        run: python notifier/daily_report.py
